name: flutter_editor
description: A Flutter code editor that runs on Android. Supports project creation, file management, and code highlighting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  code_text_field: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  collection: ^1.17.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
